<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – SmartServe SMEs</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --green:#006600; --gold:#d4a843; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(0,0,0,0.82) 0%, rgba(0,80,0,0.7) 100%),
        url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=1600&q=80') center/cover no-repeat fixed;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 50px 16px 40px;
    }

    .flag-stripe { width:100%; height:5px; background:linear-gradient(90deg,#006600 33%,#000 33%,#000 66%,#bb0000 66%); position:fixed; top:0; left:0; z-index:200; }

    .lang-float {
      position:fixed; top:14px; right:20px; z-index:300;
      display:flex; align-items:center; gap:6px;
      background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2);
      border-radius:20px; padding:5px 12px; backdrop-filter:blur(6px);
    }
    .lang-float span { font-size:0.8rem; color:rgba(255,255,255,0.6); }
    .lang-select { background:transparent; border:none; color:#fff; font-family:'Poppins',sans-serif; font-size:0.82rem; font-weight:600; cursor:pointer; outline:none; }
    .lang-select option { color:#111; background:#fff; }

    .brand { font-family:'Playfair Display',serif; font-size:1.5rem; color:var(--gold); margin-bottom:24px; text-align:center; }
    .brand span { color:#fff; }

    .card {
      width:100%; max-width:460px;
      background:rgba(255,255,255,0.97); border-radius:20px;
      padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }

    .card h2 { font-family:'Playfair Display',serif; font-size:1.6rem; color:#111; margin-bottom:6px; }
    .card .sub { font-size:0.85rem; color:#888; margin-bottom:28px; }

    label { display:block; font-size:0.82rem; color:#555; font-weight:500; margin-bottom:6px; }
    input, select {
      width:100%; padding:12px 16px; border:1.5px solid #e0e0e0; border-radius:10px;
      font-family:'Poppins',sans-serif; font-size:0.9rem; color:#111;
      margin-bottom:18px; outline:none; background:#fafafa; transition:border-color 0.2s;
    }
    input:focus, select:focus { border-color:var(--green); background:#fff; }
    select option { color:#111; }

    .btn-primary {
      width:100%; padding:14px; background:var(--green); color:#fff;
      border:none; border-radius:12px; font-family:'Poppins',sans-serif;
      font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.25s; margin-bottom:0;
    }
    .btn-primary:hover { background:#008800; transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,102,0,0.3); }
    .btn-primary:disabled { background:#ccc; cursor:not-allowed; transform:none; box-shadow:none; }

    .otp-section { display:none; margin-top:24px; padding-top:24px; border-top:1px solid #f0f0f0; }
    .otp-section.visible { display:block; }
    #otpMessage { color:#006600; font-size:0.88rem; margin-bottom:16px; line-height:1.6; }
    .otp-input { letter-spacing:8px; font-size:1.4rem; text-align:center; }

    #resendBtn {
      background:none; border:none; color:var(--green); cursor:pointer;
      font-size:0.85rem; padding:0; margin-top:8px; text-decoration:underline;
      font-family:'Poppins',sans-serif;
    }

    .footer-link { margin-top:20px; text-align:center; font-size:0.85rem; color:#666; }
    .footer-link a { color:var(--green); text-decoration:none; font-weight:600; }
    .footer-link a:hover { text-decoration:underline; }

    .back-link { margin-top:20px; text-align:center; font-size:0.8rem; }
    .back-link a { color:rgba(255,255,255,0.5); text-decoration:none; }
    .back-link a:hover { color:#fff; }
  </style>
</head>
<body>

  <div class="flag-stripe"></div>

  <div class="lang-float">
    <span>🌐</span>
    <select class="lang-select" onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="sw">Kiswahili</option>
    </select>
  </div>

  <div class="brand">Smart<span>Serve</span> SMEs</div>

  <div class="card">
    <h2 data-i18n="signup.h">Create Account</h2>
    <p class="sub" data-i18n="signup.sub">Join thousands of Kenyan businesses on SmartServe</p>

    <!-- Step 1 -->
    <form id="signup-form">
      <label data-i18n="signup.name">Full Name</label>
      <input type="text" id="name" data-i18n-placeholder="signup.name.ph" placeholder="Full Name" required>

      <label data-i18n="signup.email">Email Address</label>
      <input type="email" id="email" data-i18n-placeholder="signup.email.ph" placeholder="Email Address" required>

      <label data-i18n="signup.password">Password</label>
      <input type="password" id="password" data-i18n-placeholder="signup.pass.ph" placeholder="Password" required>

      <label data-i18n="signup.role">Sign up as:</label>
      <select id="userType" required>
        <option value="customer" data-i18n="signup.role.customer">Customer</option>
        <option value="designer" data-i18n="signup.role.provider">Provider / Designer</option>
      </select>

      <input type="hidden" id="businessCategory">
      <button type="submit" id="sendOtpBtn" class="btn-primary" data-i18n="signup.sendotp">Send Verification Code</button>
    </form>

    <!-- Step 2: OTP -->
    <div class="otp-section" id="otpSection">
      <p id="otpMessage"></p>
      <label data-i18n="signup.otp.label">Enter the 6-digit code sent to your email:</label>
      <input type="text" id="otpInput" class="otp-input" maxlength="6" placeholder="000000">
      <button type="button" id="verifyOtpBtn" class="btn-primary" data-i18n="signup.verify">Verify &amp; Create Account</button>
      <br>
      <button type="button" id="resendBtn" data-i18n="signup.resend">Resend code</button>
    </div>

    <div class="footer-link">
      <span data-i18n="signup.hasaccount">Already have an account?</span>
      <a href="signin.html" data-i18n="signup.login"> Login</a>
    </div>
  </div>

  <div class="back-link">
    <a href="business-select.html" data-i18n="signin.back">← Back to business selection</a>
  </div>

  <script src="lang.js"></script>
  <script src="signup.js" defer></script>
</body>
</html>
